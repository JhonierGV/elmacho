<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A private garden</title>
<meta name="theme-color" content="#1f2a24">
<meta name="robots" content="noindex,nofollow,noarchive">

<style>
  :root {
    --cream: #fdf6ec;
    --gold: #e8c27a;
    --rose: #d98aa3;
    --ink: #2f2a33;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --mono: "Space Mono", ui-monospace, "SFMono-Regular", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    background:
      radial-gradient(70% 50% at 50% 112%, #6f7f5a66 0%, transparent 62%),
      radial-gradient(40% 40% at 78% 6%, #f6efda22 0%, transparent 65%),
      linear-gradient(165deg, #1b241f 0%, #232a3f 55%, #171735 100%);
    color: var(--cream);
    font-family: var(--serif);
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1.4px 1.4px at 18% 22%, #fff8 0 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 74% 15%, #fff7 0 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 31% 64%, #ffe6a366 0 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 85% 43%, #fff6 0 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 58% 32%, #fff5 0 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 43% 12%, #fff5 0 50%, transparent 51%);
  }
  .lock { width: min(92vw, 430px); text-align: center; position: relative; z-index: 1; }
  .gate-art { width: 100%; max-width: 300px; margin: 0 auto 4px; display: block; opacity: .92; }
  .gate-art .grass { transform-origin: 50% 100%; animation: sway 6.5s ease-in-out infinite alternate; }
  .eyebrow {
    font-family: var(--mono);
    font-size: .64rem;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: .85;
  }
  h1 {
    margin: 10px 0 4px;
    font-size: clamp(2.1rem, 8vw, 3.1rem);
    font-weight: 400;
    font-style: italic;
    letter-spacing: -.01em;
    color: var(--cream);
  }
  .text { font-size: 1rem; opacity: .8; margin-bottom: 22px; }
  form { display: grid; gap: 12px; }
  .field { display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #fdf6ec55; padding: 4px 2px; }
  input {
    flex: 1;
    min-width: 0;
    padding: 11px 4px;
    border: 0;
    background: transparent;
    color: var(--cream);
    font-family: var(--mono);
    font-size: .95rem;
    outline: none;
  }
  input::placeholder { color: #fdf6ec4d; }
  input:focus-visible { outline: none; }
  .field:focus-within { border-color: var(--gold); }
  #toggle {
    border: 0; background: transparent; color: var(--gold);
    font-family: var(--mono); font-size: .68rem;
    letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
    padding: 8px;
  }
  .submit {
    min-height: 48px;
    border: 1px solid #fdf6ec33;
    border-radius: 999px;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform .15s ease, background .2s ease;
  }
  .submit:hover { background: #fff; }
  .submit:active { transform: translateY(2px); }
  .submit:disabled { opacity: .6; cursor: wait; }
  .error { min-height: 1.4em; color: #ffb4c4; font-size: .85rem; }
  .hint { margin-top: 18px; font-size: .72rem; opacity: .55; line-height: 1.5; font-family: var(--mono); }
  .lock.is-shaking { animation: shake .35s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-7px); }
    75% { transform: translateX(7px); }
  }
  @keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
  @media (prefers-reduced-motion: reduce) {
    .lock.is-shaking, .gate-art .grass { animation: none; }
  }
</style>
</head>
<body>
<main class="lock" id="lock">
  <svg class="gate-art" viewBox="0 0 320 200" aria-hidden="true" focusable="false">
    <path d="M30 190 V110 Q30 36 160 36 Q290 36 290 110 V190" fill="none" stroke="#e8c27a" stroke-width="2" stroke-dasharray="4 8" opacity=".5"/>
    <path d="M30 190 V110 Q30 36 160 36 Q290 36 290 110 V190" fill="none" stroke="#d98aa3" stroke-width="1" opacity=".35"/>
    <path d="M70 190 V120 M250 190 V120" stroke="#fdf6ec1f" stroke-width="5"/>
    <path d="M70 150 h180 M70 170 h180" stroke="#fdf6ec14" stroke-width="3"/>
    <circle cx="160" cy="150" r="5" fill="#e8c27a"/>
    <path d="M160 150 v-16" stroke="#e8c27a" stroke-width="2"/>
    <g class="grass" fill="#8fbc8f" opacity=".75">
      <path d="M50 190 q -18 -30 4 -42 q 12 22 -4 42"/>
      <path d="M270 190 q 18 -30 -4 -42 q -12 22 4 42"/>
      <path d="M62 190 q -8 -18 2 -26 q 6 14 -2 26" opacity=".7"/>
      <path d="M258 190 q 9 -16 -1 -24 q -6 13 1 24" opacity=".7"/>
    </g>
    <g fill="#f3b6c6">
      <circle cx="40" cy="130" r="3"/>
      <circle cx="280" cy="124" r="3"/>
      <circle cx="55" cy="118" r="2" fill="#fdf6ec"/>
      <circle cx="265" cy="112" r="2" fill="#fdf6ec"/>
    </g>
  </svg>
  <p class="eyebrow">a private garden</p>
  <h1>For Nadia</h1>
  <p class="text">What's the phrase?</p>
  <form id="gate-form" novalidate>
    <label for="phrase" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Secret phrase</label>
    <div class="field">
      <input id="phrase" name="phrase" type="password" autocomplete="current-password" placeholder="the phrase" required autofocus>
      <button type="button" id="toggle" aria-label="Show the phrase">show</button>
    </div>
    <button type="submit" class="submit" id="submit">Open the door</button>
    <p class="error" id="error" role="alert"></p>
  </form>
  <p class="hint">No matter the case, accents or extra spaces.</p>
</main>

  var lock = document.getElementById("lock");
  var form = document.getElementById("gate-form");
  var input = document.getElementById("phrase");
  var toggle = document.getElementById("toggle");
  var submit = document.getElementById("submit");
  var error = document.getElementById("error");

  function normalize(value) {
    return String(value || "")
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .trim()
      .replace(/\s+/g, " ");
  }

  function fromBase64(value) {
    var binary = atob(value);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function decrypt(passphrase) {
    var encoder = new TextEncoder();
    var material = await crypto.subtle.importKey(
      "raw",
      encoder.encode(normalize(passphrase)),
      "PBKDF2",
      false,
      ["deriveKey"]
    );
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: fromBase64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: "SHA-256" },
      material,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    var plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: fromBase64(PAYLOAD.iv) },
      key,
      fromBase64(PAYLOAD.data)
    );
    return new TextDecoder().decode(plain);
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    if (!window.crypto || !window.crypto.subtle) {
      error.textContent = "This door needs a secure connection (HTTPS). Open it from the published link.";
      return;

    error.textContent = "";
    submit.disabled = true;
    submit.textContent = "Opening…";

      document.open();
      document.write(html);
      document.close();
