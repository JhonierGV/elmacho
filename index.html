<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#25483e">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>For Nadia · A Snoopy Garden</title>
  <link rel="stylesheet" href="garden-book.css?v=pastel-1">
  <script src="garden-book.js?v=pastel-1" defer></script>
</head>
<body>
  <header class="site-header" id="home">
    <a class="wordmark" href="#home">
      <svg class="flower-mark" aria-hidden="true" viewBox="0 0 24 24" width="24" height="24">
        <path fill="currentColor" d="M12 9.2c-6-7.9 6-9.6 3.1-.8 9-2.7 10.1 8.3.8 6.6 5.2 8.3-6.5 11.1-6.8 1.4-8.1 4.6-11.1-6.8-1.8-6.8-4.9-6.6 5-10.7 4.7-.4Z"/>
        <circle cx="12" cy="12" r="2.2" fill="var(--cream)"/>
      </svg>
      Nadia’s garden
    </a>
    <a class="garden-link" href="#garden-title">The garden</a>
  </header>

  <main>
    <section id="app" class="app" aria-label="Nadia’s garden book">
      <div class="book" id="book" data-state="closed">
        <div class="book-leaf" id="bookLeaf">
          <div class="jacket" id="jacket">
            <div class="jacket-frame">
              <h1>For <em>Nadia</em></h1>
              <div class="cover__scene" aria-hidden="true">
                <div class="cover__sun"></div>
                <div class="cover__cloud"></div>
                <div class="cover__land"></div>
                <img src="snoopy.png" alt="" width="377" height="600" fetchpriority="high" draggable="false">
                <div class="cover__meadow"></div>
              </div>
              <button type="button" class="open-book" id="openBook">Open the book <span aria-hidden="true">↗</span></button>
            </div>
          </div>
          <section class="seed-page" id="seedPage" aria-labelledby="garden-title" inert aria-hidden="true">
            <header class="garden-heading">
              <h2 id="garden-title" tabindex="-1">The garden</h2>
              <p id="gardenInstructions">Tap the meadow to plant. Grow three of each flower to open your dedication.</p>
            </header>
            <div class="dock">
              <h3>Pick a seed</h3>
              <div class="seeds" id="seeds" role="group" aria-label="Flower styles"></div>
              <button type="button" class="primary plant-btn" id="plantBtn">Plant</button>
            </div>
            <div class="garden-actions">
              <div class="progress">
                <label for="progress">Flowers grown</label>
                <span class="counter" id="counter" aria-hidden="true">0 / 18</span>
                <progress id="progress" value="0" max="18"></progress>
              </div>
              <button type="button" class="sky-toggle" id="skyToggle" aria-label="Switch to night" title="Switch to night">
                <span class="sky-toggle__sun" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.8v2.3M12 18.9v2.3M2.8 12h2.3M18.9 12h2.3M5.5 5.5l1.6 1.6M16.9 16.9l1.6 1.6M18.5 5.5l-1.6 1.6M7.1 16.9l-1.6 1.6"/></svg></span>
                <span class="sky-toggle__moon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.8 8.8 0 1 0 10.8 10.8Z"/></svg></span>
                <span id="skyLabel" aria-hidden="true">Night</span>
              </button>
              <button type="button" class="letter-button" id="readFinale" hidden>Read the dedication</button>
            </div>
          </section>
        </div>
        <div class="meadow-page">
          <section class="garden" id="garden" inert aria-hidden="true" aria-label="Interactive garden">
            <div class="sky" aria-hidden="true">
              <div class="moon"></div>
              <div class="stars" id="stars"></div>
            </div>
            <div class="garden__hills" aria-hidden="true"></div>
            <div class="snoopy-slot" id="snoopy"></div>
            <button type="button" class="firefly" id="firefly" aria-label="Light up the fireflies" aria-pressed="false" hidden></button>
            <div class="firefly-trail" aria-hidden="true"></div>
            <img class="garden-couple" src="garden-couple.webp" alt="The two of us watching the flowers together" draggable="false">
            <div class="ground" id="ground">
              <div class="flowers" id="flowers"></div>
              <button type="button" class="cockroach is-hidden" id="cockroach" aria-label="Hidden cucaracha polaca" aria-hidden="true" tabindex="-1">
                <svg viewBox="0 0 40 26" aria-hidden="true" focusable="false">
                  <g class="cockroach__legs" stroke="#3a2318" stroke-width="1.6" stroke-linecap="round">
                    <path d="M14 14 L6 9"/><path d="M14 17 L5 18"/><path d="M14 19 L7 24"/>
                    <path d="M26 14 L34 9"/><path d="M26 17 L35 18"/><path d="M26 19 L33 24"/>
                  </g>
                  <ellipse cx="20" cy="16" rx="9" ry="6" fill="#8a4b2a"/>
                  <circle cx="20" cy="10" r="4.5" fill="#6e3a21"/>
                  <path d="M17 7 L14 3 M23 7 L26 3" stroke="#3a2318" stroke-width="1.4" stroke-linecap="round"/>
                  <path d="M11 12 Q20 16 29 12" stroke="#fdf6ec" stroke-width="3" fill="none"/>
                  <path d="M11 12 Q20 16 29 12" stroke="#c94f3d" stroke-width="3" fill="none" stroke-dasharray="3 3"/>
                </svg>
              </button>
            </div>
          </section>

        </div>
      </div>
      <noscript><p>This garden needs JavaScript to open.</p></noscript>
      <div class="toast" id="toast" role="status"></div>
      <p class="sr-only" id="sr" aria-live="polite"></p>
      <dialog class="finale" id="finale" aria-labelledby="finale-title">
        <div class="finale__card">
          <div class="finale__art">
            <img src="dedication-art.webp" alt="Two pixel-art characters holding hands beneath a purple heart" width="1366" height="1152" loading="lazy" decoding="async" draggable="false">
          </div>
          <div>
            <h2 class="finale__title" id="finale-title">This whole garden is yours,<br><em>cucaracha polaca.</em></h2>
            <button type="button" class="primary finale__close" autofocus>Stay in the garden</button>
          </div>
        </div>
      </dialog>
    </section>
  </main>
</body>
</html>
